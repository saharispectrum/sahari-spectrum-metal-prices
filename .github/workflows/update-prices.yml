name: Update Metal Prices

on:
  schedule:
    # Every 5 minutes from 10:00 AM to 10:15 AM IST
    - cron: '0,5,10,15 10 * * *'
      timezone: 'Asia/Kolkata'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metal-prices:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      # Step 3: Install dependencies
      - name: Install dependencies
        working-directory: scraper
        run: npm ci

      # Step 4: Install Playwright Chromium
      - name: Install Playwright browser
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      # Step 5: Execute scraper
      - name: Fetch Lalithaa metal prices
        run: node scraper/fetch-prices.js

      # Step 6: Commit updated prices
      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add prices.json

          if git diff --cached --quiet; then
            echo "Metal prices have not changed. No commit required."
          else
            git commit -m "Update gold and silver prices"
            git push
          fi
